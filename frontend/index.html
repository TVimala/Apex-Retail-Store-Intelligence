<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Retail Intelligence Dashboard</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div class="container">

        <header>
            <h1>APEX RETAIL DASHBOARD</h1>
            <p id="status">Connecting...</p>
        </header>

        <div class="grid">

            <!-- Metrics -->
            <div class="card">
                <h2>Metrics</h2>
                <div id="metrics">Loading...</div>
            </div>

            <!-- Funnel -->
            <div class="card">
                <h2>Funnel</h2>
                <div id="funnel">Loading...</div>
            </div>

            <!-- Heatmap -->
            <div class="card">
                <h2>Zone Heatmap</h2>
                <div id="heatmap">Loading...</div>
            </div>

            <!-- Anomalies -->
            <div class="card">
                <h2>Anomalies</h2>
                <div id="anomalies">Loading...</div>
            </div>

        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
